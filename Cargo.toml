[package]
name = "vtf"
description = "Valve Texture format library for Rust"
version = "0.4.1"
license = "MIT"
authors = ["Roman Shishkin <spark@uwtech.org>", "Robin Appelman <robin@icewind.nl>"]
repository = "https://github.com/roman901/vtf-rs"
edition = "2018"
rust-version = "1.67.0"
exclude = ["/tests"]

[dependencies]
image = { version = "0.25.2", default-features = false }
texpresso = "2.0.1"
thiserror = "2.0.11"
parse-display = "0.10.0"
num_enum = "0.7.2"
byteorder = "1.5.0"

[dev-dependencies]
image = { version = "0.25.2", features = ["png"], default-features = false }
